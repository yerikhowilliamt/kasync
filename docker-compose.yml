services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasync-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/kasync_db?schema=public"
      JWT_SECRET: "docker-prod-access-secret-key-change-me"
      JWT_REFRESH_SECRET: "docker-prod-refresh-secret-key-change-me"
      JWT_EXPIRES_IN: "1d"
      JWT_REFRESH_EXPIRES_IN: "30d"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
      CLOUDINARY_CLOUD_NAME: "your-cloud-name"
      CLOUDINARY_API_KEY: "your-api-key"
      CLOUDINARY_API_SECRET: "your-api-secret"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: kasync-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kasync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kasync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

